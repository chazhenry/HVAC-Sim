# HVAC-Sim API. A site of its own: it shares nothing with other server blocks.
# Installed once as /etc/nginx/sites-available/__NAME__; certbot then adds TLS
# to this file in place, so later deploys leave it alone.

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # HVAC-Sim visitor IP forwarding
    # Restore visitor addresses when cloudflared connects locally. Public clients
    # cannot supply trusted CF-Connecting-IP headers directly.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/__NAME___access.log;
    error_log  /var/log/nginx/__NAME___error.log warn;

    client_max_body_size 256k;

    location /api/ {
        proxy_pass         http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
